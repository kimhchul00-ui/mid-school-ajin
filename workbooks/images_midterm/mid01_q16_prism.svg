<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 160" width="100%" height="130">
  <!-- Top triangle ABC: (90,20), (40,50), (140,50) -->
  <polygon points="90,20 40,50 140,50" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1.8"/>
  <!-- Bottom triangle DEF: (90,100), (40,130), (140,130) -->
  <line x1="40" y1="130" x2="140" y2="130" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="40" y1="130" x2="90" y2="100" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="3,3"/>
  <line x1="140" y1="130" x2="90" y2="100" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="3,3"/>
  <!-- Vertical pillars -->
  <line x1="40" y1="50" x2="40" y2="130" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="140" y1="50" x2="140" y2="130" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="90" y1="20" x2="90" y2="100" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="3,3"/>
  <!-- Vertices -->
  <circle cx="90" cy="20" r="3" fill="#1e293b"/>
  <circle cx="40" cy="50" r="3" fill="#1e293b"/>
  <circle cx="140" cy="50" r="3" fill="#1e293b"/>
  <circle cx="90" cy="100" r="3" fill="#1e293b"/>
  <circle cx="40" cy="130" r="3" fill="#1e293b"/>
  <circle cx="140" cy="130" r="3" fill="#1e293b"/>
</svg>