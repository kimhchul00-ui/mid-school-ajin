<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 70" width="100%" height="60">
  <line x1="20" y1="35" x2="430" y2="35" stroke="#333" stroke-width="2"/>
  <polygon points="430,31 440,35 430,39" fill="#333"/>
  <!-- Ticks from -5 to 5. step = 36px. 0 at x=220 -->
  <!-- -5: 40, -4: 76, -3: 112, -2: 148, -1: 184, 0: 220, 1: 256, 2: 292, 3: 328, 4: 364, 5: 400 -->
  <!-- ticks -->
  <line x1="40" y1="30" x2="40" y2="40" stroke="#333" stroke-width="1.5"/><text x="40" y="55" text-anchor="middle" font-size="11">-5</text>
  <line x1="76" y1="30" x2="76" y2="40" stroke="#333" stroke-width="1.5"/><text x="76" y="55" text-anchor="middle" font-size="11">-4</text>
  <line x1="112" y1="30" x2="112" y2="40" stroke="#333" stroke-width="1.5"/><text x="112" y="55" text-anchor="middle" font-size="11">-3</text>
  <line x1="148" y1="30" x2="148" y2="40" stroke="#333" stroke-width="1.5"/><text x="148" y="55" text-anchor="middle" font-size="11">-2</text>
  <line x1="184" y1="30" x2="184" y2="40" stroke="#333" stroke-width="1.5"/><text x="184" y="55" text-anchor="middle" font-size="11">-1</text>
  <line x1="220" y1="30" x2="220" y2="40" stroke="#333" stroke-width="1.5"/><text x="220" y="55" text-anchor="middle" font-size="11">0</text>
  <line x1="256" y1="30" x2="256" y2="40" stroke="#333" stroke-width="1.5"/><text x="256" y="55" text-anchor="middle" font-size="11">1</text>
  <line x1="292" y1="30" x2="292" y2="40" stroke="#333" stroke-width="1.5"/><text x="292" y="55" text-anchor="middle" font-size="11">2</text>
  <line x1="328" y1="30" x2="328" y2="40" stroke="#333" stroke-width="1.5"/><text x="328" y="55" text-anchor="middle" font-size="11">3</text>
  <line x1="364" y1="30" x2="364" y2="40" stroke="#333" stroke-width="1.5"/><text x="364" y="55" text-anchor="middle" font-size="11">4</text>
  <line x1="400" y1="30" x2="400" y2="40" stroke="#333" stroke-width="1.5"/><text x="400" y="55" text-anchor="middle" font-size="11">5</text>
  <!-- Point A at -5 -->
  <circle cx="40" cy="35" r="3.5" fill="#1a73e8"/>
  <text x="40" y="22" text-anchor="middle" font-weight="bold" font-size="12" fill="#1a73e8">A</text>
  <!-- Point B at -2 and 1/3 (148 - 12 = 136) -->
  <circle cx="136" cy="35" r="3.5" fill="#1a73e8"/>
  <text x="136" y="22" text-anchor="middle" font-weight="bold" font-size="12" fill="#1a73e8">B</text>
  <!-- Point C at 1 (256) -->
  <circle cx="256" cy="35" r="3.5" fill="#1a73e8"/>
  <text x="256" y="22" text-anchor="middle" font-weight="bold" font-size="12" fill="#1a73e8">C</text>
  <!-- Point D at 3 (328) -->
  <circle cx="328" cy="35" r="3.5" fill="#1a73e8"/>
  <text x="328" y="22" text-anchor="middle" font-weight="bold" font-size="12" fill="#1a73e8">D</text>
</svg>