<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 170" width="100%" height="140">
  <!-- Cuboid ABCD-EFGH style labeled with A,B,C,D,E... -->
  <!-- Top: B(50,45), A(100,20), D(150,30), C(100,55) -->
  <polygon points="50,45 100,20 150,30 100,55" fill="rgba(37,99,235,0.08)" stroke="#2563eb" stroke-width="1.8"/>
  <text x="40" y="45" font-size="11" font-weight="bold">B</text>
  <text x="100" y="14" font-size="11" font-weight="bold">A</text>
  <text x="155" y="30" font-size="11" font-weight="bold">E</text>
  <text x="100" y="52" font-size="11" font-weight="bold">C</text>
  <text x="135" y="42" font-size="11" font-weight="bold">D</text>
  <!-- Bottom: G(50,125), F(100,100), I(150,110), H(100,135) -->
  <line x1="50" y1="125" x2="100" y2="135" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="100" y1="135" x2="150" y2="110" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="50" y1="125" x2="100" y2="100" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="3,3"/>
  <line x1="100" y1="100" x2="150" y2="110" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="3,3"/>
  <!-- Verticals -->
  <line x1="50" y1="45" x2="50" y2="125" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="100" y1="55" x2="100" y2="135" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="150" y1="30" x2="150" y2="110" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="100" y1="20" x2="100" y2="100" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="3,3"/>
  <text x="40" y="130" font-size="11" font-weight="bold">G</text>
  <text x="90" y="100" font-size="11" font-weight="bold">F</text>
  <text x="155" y="115" font-size="11" font-weight="bold">I</text>
  <text x="100" y="148" font-size="11" font-weight="bold">H</text>
  <text x="125" y="112" font-size="11" font-weight="bold">J</text>
</svg>