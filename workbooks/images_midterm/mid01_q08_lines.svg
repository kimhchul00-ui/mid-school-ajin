<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="100%" height="170">
  <defs>
    <pattern id="g8" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="20" y="15" width="200" height="170" fill="url(#g8)"/>
  <!-- Origin at (120, 100) -->
  <line x1="20" y1="100" x2="225" y2="100" stroke="#333" stroke-width="1.5"/>
  <line x1="120" y1="185" x2="120" y2="15" stroke="#333" stroke-width="1.5"/>
  <text x="228" y="104" font-size="10">x</text>
  <text x="125" y="18" font-size="10">y</text>
  <text x="110" y="112" font-size="10">O</text>
  <!-- ticks -->
  <text x="80" y="95" font-size="9">-2</text>
  <text x="160" y="95" font-size="9">2</text>
  <text x="125" y="65" font-size="9">2</text>
  <text x="125" y="145" font-size="9">-2</text>
  <!-- Line (가): y = 2x -->
  <line x1="70" y1="185" x2="160" y2="20" stroke="#64748b" stroke-width="1.5"/>
  <text x="85" y="25" font-size="10" font-weight="bold">(가)</text>
  <!-- Line (나): y = -3x -->
  <line x1="85" y1="15" x2="145" y2="185" stroke="#64748b" stroke-width="1.5"/>
  <text x="65" y="65" font-size="10" font-weight="bold">(나)</text>
  <!-- Line (다): y = x -->
  <line x1="40" y1="180" x2="200" y2="20" stroke="#64748b" stroke-width="1.5"/>
  <text x="155" y="25" font-size="10" font-weight="bold">(다)</text>
  <!-- Line (라): y = (1/2)x -->
  <line x1="30" y1="145" x2="210" y2="55" stroke="#64748b" stroke-width="1.5"/>
  <text x="205" y="45" font-size="10" font-weight="bold">(라)</text>
  <!-- Line (마): y = -(1/3)x -> passes (120,100), (60,80), (180,120) -->
  <line x1="30" y1="70" x2="210" y2="130" stroke="#dc2626" stroke-width="2.5"/>
  <text x="210" y="125" font-size="11" font-weight="bold" fill="#dc2626">(마)</text>
</svg>