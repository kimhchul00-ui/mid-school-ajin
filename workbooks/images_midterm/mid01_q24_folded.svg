<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 160" width="100%" height="140">
  <!-- Original strip top and bottom parallel lines -->
  <line x1="20" y1="35" x2="200" y2="35" stroke="#333" stroke-width="1.8"/>
  <line x1="20" y1="125" x2="200" y2="125" stroke="#333" stroke-width="1.8"/>
  <!-- Folded polygon -->
  <polygon points="55,125 105,35 155,125" fill="rgba(37,99,235,0.15)" stroke="#2563eb" stroke-width="2"/>
  <polygon points="55,125 105,35 70,35" fill="rgba(100,116,139,0.2)" stroke="#64748b" stroke-width="1.5"/>
  <!-- Angles: fold angle at 110° -->
  <text x="125" y="115" font-size="11" font-weight="bold">110°</text>
  <text x="75" y="120" font-size="11" font-weight="bold" fill="#dc2626">x</text>
  <text x="80" y="55" font-size="11" font-weight="bold" fill="#2563eb">y</text>
</svg>