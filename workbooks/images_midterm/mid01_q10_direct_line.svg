<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="100%" height="150">
  <!-- Origin at (100, 90) -->
  <line x1="20" y1="90" x2="180" y2="90" stroke="#333" stroke-width="1.5"/>
  <line x1="100" y1="165" x2="100" y2="15" stroke="#333" stroke-width="1.5"/>
  <text x="183" y="94" font-size="10">x</text>
  <text x="93" y="15" font-size="10">y</text>
  <text x="90" y="102" font-size="10">O</text>
  <!-- Line passes (100,90), (60,45) -> point (b, 3), and (120, 150) -> point (2, -6) -->
  <line x1="45" y1="20" x2="135" y2="165" stroke="#2563eb" stroke-width="2"/>
  <!-- Point (b, 3) -->
  <line x1="60" y1="45" x2="60" y2="90" stroke="#888" stroke-dasharray="2,2"/>
  <line x1="60" y1="45" x2="100" y2="45" stroke="#888" stroke-dasharray="2,2"/>
  <circle cx="60" cy="45" r="3" fill="#333"/>
  <text x="60" y="103" text-anchor="middle" font-size="11">b</text>
  <text x="106" y="48" font-size="11">3</text>
  <!-- Point (2, -6) -->
  <line x1="120" y1="135" x2="120" y2="90" stroke="#888" stroke-dasharray="2,2"/>
  <line x1="100" y1="135" x2="120" y2="135" stroke="#888" stroke-dasharray="2,2"/>
  <circle cx="120" cy="135" r="3" fill="#333"/>
  <text x="120" y="85" text-anchor="middle" font-size="11">2</text>
  <text x="80" y="139" font-size="11">-6</text>
</svg>