<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="100%" height="180">
  <!-- Grid -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="20" y="20" width="180" height="180" fill="url(#grid)"/>
  <!-- Axes: origin at (110, 110) -->
  <line x1="20" y1="110" x2="205" y2="110" stroke="#333" stroke-width="1.5"/>
  <polygon points="205,107 212,110 205,113" fill="#333"/>
  <text x="210" y="123" font-size="11">x</text>
  <line x1="110" y1="200" x2="110" y2="15" stroke="#333" stroke-width="1.5"/>
  <polygon points="107,15 110,8 113,15" fill="#333"/>
  <text x="115" y="16" font-size="11">y</text>
  <text x="98" y="123" font-size="10">O</text>
  <text x="70" y="123" font-size="10">-2</text>
  <text x="150" y="123" font-size="10">2</text>
  <text x="98" y="73" font-size="10">2</text>
  <text x="94" y="153" font-size="10">-2</text>
  <!-- Points -->
  <!-- A(0, 3) -> (110, 50) -->
  <circle cx="110" cy="50" r="3.5" fill="#2563eb"/>
  <text x="118" y="52" font-size="11" font-weight="bold">A</text>
  <!-- E(1, 2) -> (130, 70) -->
  <circle cx="130" cy="70" r="3.5" fill="#2563eb"/>
  <text x="138" y="68" font-size="11" font-weight="bold">E</text>
  <!-- D(3, 0) -> (170, 110) -->
  <circle cx="170" cy="110" r="3.5" fill="#2563eb"/>
  <text x="170" y="102" font-size="11" font-weight="bold">D</text>
  <!-- C(2, -2) -> (150, 150) -->
  <circle cx="150" cy="150" r="3.5" fill="#2563eb"/>
  <text x="157" y="153" font-size="11" font-weight="bold">C</text>
  <!-- B(-2, -1) -> (70, 130) -->
  <circle cx="70" cy="130" r="3.5" fill="#2563eb"/>
  <text x="56" y="133" font-size="11" font-weight="bold">B</text>
</svg>