<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 190" width="100%" height="160">
  <!-- Center triangle BDF: B(50,110), D(150,110), F(100,25) wait, inverted -->
  <!-- Top A(100, 20), Left C(40, 140), Right E(160, 140) -->
  <!-- Inner triangle: B(70, 80), F(130, 80), D(100, 140) -->
  <polygon points="100,20 40,140 160,140" fill="none" stroke="#2563eb" stroke-width="2"/>
  <line x1="70" y1="80" x2="130" y2="80" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="3,3"/>
  <line x1="70" y1="80" x2="100" y2="140" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="3,3"/>
  <line x1="130" y1="80" x2="100" y2="140" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="3,3"/>
  <polygon points="70,80 130,80 100,140" fill="rgba(37,99,235,0.12)"/>
  <text x="100" y="14" text-anchor="middle" font-size="12" font-weight="bold">A</text>
  <text x="55" y="80" font-size="11" font-weight="bold">B</text>
  <text x="135" y="80" font-size="11" font-weight="bold">F</text>
  <text x="30" y="145" font-size="11" font-weight="bold">C</text>
  <text x="100" y="155" text-anchor="middle" font-size="11" font-weight="bold">D</text>
  <text x="165" y="145" font-size="11" font-weight="bold">E</text>
</svg>